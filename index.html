<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>مساعد التحضير لمسابقة مراقب الخزينة</title>
<style>
:root{
  --ink:#182b42; --muted:#587086; --paper:#f5f0e7; --card:#fffaf2; --line:#d8cdbc;
  --copper:#b87945; --copper-dark:#8d542e; --copper-light:#e2a97d;
  --green:#36745f; --green-bg:#e7f0ea; --red:#a45043; --red-bg:#f6e8e4;
  --amber:#a3781f; --amber-bg:#f3ecd8;
  --shadow:0 20px 55px #182b4218; --shadow-sm:0 8px 22px #182b4214;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 0,#b8794522,transparent 34%),radial-gradient(circle at 95% 15%,#36745f14,transparent 40%),var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column}
body.rtl{direction:rtl}
button{font:inherit}
button:focus-visible{outline:3px solid var(--copper-light);outline-offset:3px}
#app{flex:1 0 auto}
.top{padding:15px clamp(18px,5vw,72px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#f5f0e7ee;position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:bold;letter-spacing:.12em}
.seal{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--copper);color:var(--copper);font-size:20px;border-radius:50%;background:#fffaf2}
.brand small{display:block;font:11px Arial;color:var(--copper-dark);letter-spacing:.16em;font-weight:400}
.topnote{color:var(--muted);font:13px Arial;display:flex;align-items:center;gap:14px}
.langswitch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langswitch button{padding:7px 15px;background:transparent;border:0;cursor:pointer;color:var(--muted);font:12px Arial;letter-spacing:.04em}
.langswitch button.active{background:var(--ink);color:#fffaf2}
.wrap{width:min(1180px,calc(100% - 36px));margin:auto}

/* ---------- Landing ---------- */
.eyebrow{color:var(--copper-dark);font:700 12px Arial;letter-spacing:.14em;text-transform:uppercase}
.hero{padding:52px 0 18px;text-align:center}
.hero h1{font-size:clamp(30px,4.4vw,54px);line-height:1.14;margin:16px auto 14px;letter-spacing:-.02em;max-width:820px}
.hero p{font:18px/1.85 Arial;color:var(--muted);max-width:680px;margin:0 auto}
.hero-facts{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.hero-facts div{text-align:center}
.hero-facts strong{display:block;color:var(--copper-dark);font-size:24px}
.hero-facts span{font:12px Arial;color:var(--muted)}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:42px 0 10px}
.mode-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px;box-shadow:var(--shadow-sm);cursor:pointer;text-align:start;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;display:flex;flex-direction:column;gap:10px}
.mode-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--copper)}
.mode-card .micon{font-size:30px}
.mode-card h3{margin:2px 0 0;font-size:21px}
.mode-card p{margin:0;font:14px/1.7 Arial;color:var(--muted)}
.mode-card .mtag{align-self:start;background:var(--copper);color:#fff;padding:5px 12px;border-radius:999px;font:700 12px Arial;letter-spacing:.03em}

.domain-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:26px;margin:26px 0}
.domain-panel h2{margin:0 0 6px;font-size:22px}
.domain-panel .sub{margin:0 0 22px;color:var(--muted);font:14px Arial}
.domains{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.domain-card{border:1px solid var(--line);background:#fffaf280;border-radius:12px;padding:17px;text-align:start;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s, background .15s}
.domain-card:hover{border-color:var(--copper);background:#fffaf2}
.domain-card .dicon{font-size:24px;flex-shrink:0}
.domain-card h4{margin:0 0 4px;font-size:15.5px}
.domain-card span{font:12px Arial;color:var(--muted)}
.backlink{background:transparent;border:0;color:var(--copper-dark);font:700 13px Arial;cursor:pointer;padding:0;margin-bottom:18px;display:inline-flex;align-items:center;gap:6px}

.history{margin:40px 0 60px;border-top:1px solid var(--line);padding-top:24px}
.history h3{margin:0 0 14px;font-size:18px}
.history-list{display:grid;gap:8px;max-height:260px;overflow:auto}
.history-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:#efe5d7;border-radius:10px;font:12.5px Arial}
.history-row button{padding:6px 12px;font-size:11.5px;border-radius:8px}
.history-detail-list{margin-top:28px}
.history-row b{color:var(--copper-dark)}
.secondary{background:transparent;border:1px solid var(--line);padding:12px 16px;cursor:pointer;color:var(--ink);border-radius:9px}
.secondary:hover{border-color:var(--copper)}
.primary{border:0;background:var(--copper);color:white;padding:14px 20px;cursor:pointer;font-weight:bold;border-radius:9px;transition:background .15s}
.primary:hover{background:var(--copper-dark)}
.micro{font:12.5px Arial;color:var(--muted)}

/* ---------- Exam ---------- */
.exam{display:grid;grid-template-columns:280px 1fr;gap:44px;padding:34px 0}
.rtl .exam{grid-template-columns:1fr 280px}
.rtl .rail{order:2}
.rail{background:var(--ink);color:white;padding:24px;position:sticky;top:96px;align-self:start;min-height:calc(100vh - 150px);border-radius:var(--radius)}
.railhead{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff2b;padding-bottom:16px;font:12px Arial}
.railmode{font:11px Arial;color:#e2c9ac;letter-spacing:.06em;margin-top:4px}
.clock{font-size:28px;font-weight:bold;margin:18px 0 6px;color:#fff}
.clock.warn{color:#f2a68e}
.bar{height:5px;background:#ffffff24;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--copper)}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:20px;max-height:260px;overflow:auto;padding-inline-end:2px}
.map button{aspect-ratio:1;background:transparent;border:1px solid #ffffff33;color:#d7e0e8;cursor:pointer;font:11.5px Arial;border-radius:6px}
.map button.filled{background:#b87945bb;border-color:var(--copper)}
.map button.current{outline:2px solid #f0c39f}
.finish{margin-top:22px;background:transparent;border:1px solid #ffffff33;color:#f2c19e;cursor:pointer;width:100%;padding:11px;border-radius:9px;font:700 13px Arial}
.finish:hover{border-color:#f2c19e}

.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font:700 13.5px Arial;color:var(--muted)}
.qmeta span:first-child{background:var(--ink);color:#fffaf2;padding:6px 14px;border-radius:999px;font-weight:700;letter-spacing:.02em}
.qmeta b{color:var(--copper-dark);background:#efe5d7;padding:6px 12px;border-radius:999px}
.qbadge{background:#efe5d7;padding:6px 12px;border-radius:999px;font:700 11.5px Arial;color:var(--copper-dark)}
.question{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:28px clamp(18px,4vw,34px);margin-top:16px}
.question h2{font-size:clamp(20px,2.4vw,29px);line-height:1.5;margin:0;font-weight:700;word-break:break-word;overflow-wrap:anywhere}
.opts{display:grid;gap:12px;margin-top:30px}
.opt{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#fffaf280;padding:16px 18px;text-align:start;cursor:pointer;color:var(--ink);border-radius:11px;transition:border-color .12s, background .12s}
.opt>span:not(.key):not(.mark){flex:1;word-break:break-word;overflow-wrap:anywhere}
.opt:hover{border-color:var(--copper)}
.opt.sel{background:#eddcc6;border-color:var(--copper);font-weight:600}
.opt .key{width:28px;height:28px;flex-shrink:0;border:1px solid var(--line);display:grid;place-items:center;font:700 12px Arial;border-radius:8px;color:var(--copper-dark)}
.opt.sel .key{background:var(--copper);color:#fff;border-color:var(--copper)}
.opt .mark{margin-inline-start:auto;color:var(--copper)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:12px}
.nav button{background:transparent;border:1px solid var(--line);padding:13px 18px;cursor:pointer;color:var(--ink);border-radius:9px}
.nav button:disabled{opacity:.4;cursor:default}
.nav span{font:12.5px Arial;color:var(--muted)}

/* ---------- Review (pre-submit) ---------- */
.review{padding:34px 0}
.review h1{margin:10px 0 4px}
.reviewgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:26px 0}
.reviewgrid button{border:1px solid var(--line);background:var(--card);padding:14px 8px;border-radius:11px;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center}
.reviewgrid button.done{border-color:var(--green);background:var(--green-bg)}
.reviewgrid button.open{border-color:var(--amber);background:var(--amber-bg)}
.reviewgrid button strong{font:11px Arial;color:var(--muted)}
.reviewgrid button small{font:10.5px Arial;color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.modal{position:fixed;inset:0;background:#182b4266;display:grid;place-items:center;z-index:20;padding:20px}
.modalbox{background:var(--card);border-radius:var(--radius);padding:30px;max-width:420px;box-shadow:var(--shadow)}
.modalbox h2{margin-top:0}
.modalbox .actions{justify-content:flex-end}

/* ---------- Results ---------- */
.results{padding:34px 0;display:grid;grid-template-columns:300px 1fr;gap:44px;align-items:start}
.rtl .results{grid-template-columns:1fr 300px}
.rtl .score{order:2}
.score{background:var(--ink);color:#fffaf2;border-radius:var(--radius);padding:30px;position:sticky;top:96px;text-align:center}
.score .eyebrow{color:#e2c9ac}
.score h1{margin:14px 0 6px;font-size:21px}
.scorevalue{font-size:44px;font-weight:bold;color:#fff}
.score>span{font:14px Arial;color:#cfd9e2}
.score>p.scorevalue{font-size:26px;margin:6px 0 18px}
.tier{margin:16px 0 22px;padding:12px 14px;border-radius:10px;font:700 13px Arial}
.tier-great{background:#2f6a52;color:#e9f6ee}
.tier-good{background:#3c6f8d;color:#eaf3f8}
.tier-mid{background:#96731f;color:#fbf3e0}
.tier-low{background:#8a3b34;color:#fbe9e6}
.score .actions{flex-direction:column}
.score .actions button{width:100%}

.resultitem{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.resultitem.ok{border-inline-start:4px solid var(--green)}
.resultitem:not(.ok){border-inline-start:4px solid var(--red)}
.resulttop{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.resulttop span{background:#efe5d7;color:var(--copper-dark);font:700 12px Arial;padding:4px 10px;border-radius:999px;flex-shrink:0}
.resulttop h3{margin:0;font-size:18px;flex:1}
.legal-note{margin-top:14px;padding:12px 14px;border-inline-start:3px solid var(--copper);background:#efe5d7aa;font:13px/1.6 Arial;color:var(--muted);border-radius:0 8px 8px 0}
.legal-note b{color:var(--copper-dark)}
.scoreline{margin-top:10px;font:13px Arial;color:var(--muted)}
.answers{margin-top:12px}
.option-review{display:grid;gap:7px;margin-top:8px}
.option-mark{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font:13px Arial;background:#f5f0e7}
.option-mark b:first-child{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:#e3d8c4;font-size:11px;flex-shrink:0}
.option-mark span{flex:1}
.option-mark.correct{background:var(--green-bg)}
.option-mark.correct b:first-child{background:var(--green);color:#fff}
.option-mark.selected.incorrect{background:var(--red-bg)}
.option-mark.selected.incorrect b:first-child{background:var(--red);color:#fff}
.mark-positive{color:var(--green)}
.mark-negative{color:var(--red)}

/* ---------- Footer ---------- */
footer.site-footer{flex-shrink:0;margin-top:40px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,#efe3d366);padding:26px clamp(18px,5vw,72px) 30px}
.footer-inner{width:min(1180px,calc(100% - 36px));margin:auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.footer-brand{display:flex;align-items:center;gap:12px}
.footer-badge{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--copper),var(--copper-dark));color:#fffaf2;display:grid;place-items:center;font:800 13px Arial;letter-spacing:.02em;box-shadow:var(--shadow-sm)}
.footer-text b{display:block;font:700 13px Arial;color:var(--ink);letter-spacing:.02em}
.footer-text span{display:block;font:11.5px Arial;color:var(--muted);margin-top:2px}
.footer-tag{font:12px Arial;color:var(--muted)}

@media(max-width:920px){
  .modes{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr}
  .rail{position:relative;top:0;min-height:0}
  .rtl .rail{order:0}
  .results{grid-template-columns:1fr}
  .score{position:relative;top:0}
  .rtl .score{order:0}
  .footer-inner{flex-direction:column;align-items:flex-start}
}

</style>
</head>
<body class="rtl">
<header class="top">
  <div class="brand"><span class="seal">⌑</span><span>مراقب الخزينة<small>PRÉPARATION AU CONCOURS</small></span></div>

    <div class="langswitch">
      <button id="btnAr" onclick="setLang('ar')">AR</button>

  </div>
</header>
<div id="app"></div>
<footer class="site-footer">

  </div>
</footer>

nt uniquement des dépenses d'investissement","Ce sont uniquement des dépenses de fonctionnement"],"ex":"La dépense réelle procure à l'État un bien ou service, contrairement à la dépense de transfert, comme les subventions."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الثالث: النفقات العامة (3.3 تصنيفات النفقات).","fr":"Note de révision jointe, section 3 : Les dépenses publiques (3.3 classifications des dépenses)."},"cat":"dp"},{"id":67,"pts":1,"a":[1],"ar":{"q":"يعتبر نمو النفقات العامة ظاهريًا وليس حقيقيًا عندما ينتج عن:","o":["تحسن جودة الخدمات العامة","انخفاض قيمة النقود (التضخم) أو تغير طريقة المحاسبة","اتساع وظائف الدولة","إنشاء مؤسسات جديدة"],"ex":"قد يكون نمو النفقات ظاهريًا نتيجة انخفاض قيمة النقود أو تغير طريقة المحاسبة، بخلاف النمو الحقيقي الناتج عن اتساع الوظائف أو تحسن الخدمات."},"fr":{"q":"La croissance des dépenses publiques est dite apparente plutôt que réelle lorsqu'elle résulte de :","o":["L'amélioration de la qualité des services publics","La dépréciation monétaire ou le changement de méthode comptable","L'extension des fonctions de l'État","La création de nouveaux établissements"],"ex":"La croissance peut être apparente en raison de la dépréciation monétaire ou d'un changement comptable, contrairement à la croissance réelle."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الثالث: النفقات العامة (3.4 أسباب نمو النفقات العامة).","fr":"Note de révision jointe, section 3 : Les dépenses publiques (3.4 causes de la croissance des dépenses)."},"cat":"mf"},{"id":68,"pts":2,"a":[0,1,3],"ar":{"q":"تشمل الإيرادات العامة مصادر عدة أهمها:","o":["إيرادات أملاك الدولة","الضرائب والرسوم","المصاريف الشخصية للموظفين","الاقتراض"],"ex":"يشمل الإيراد العام إيرادات أملاك الدولة والضرائب والرسوم وعوائد المؤسسات العامة والمنح والاقتراض."},"fr":{"q":"La recette publique englobe notamment :","o":["Les revenus du domaine de l'État","Les impôts et taxes","Les dépenses personnelles des agents","L'emprunt"],"ex":"La recette publique comprend les revenus du domaine de l'Ét وة).","fr":"Note de révision jointe, section 4 : Les recettes publiques (4.3 taxe et redevance)."},"cat":"dr"},{"id":71,"pts":2,"a":[0,1,3],"ar":{"q":"عند تقييم القرض العام ينبغي مراعاة:","o":["كلفة القرض ومدته","مخاطره وقدرة الدولة على السداد","لون العملة المستعملة فقط","أثره على الدين العام"],"ex":"يجب تقييم كلفة القرض ومدته ومخاطره وقدرة الدولة على السداد وأثره على الدين العام."},"fr":{"q":"Lors de l'évaluation d'un emprunt public, il convient de considérer :","o":["Le coût et la durée de l'emprunt","Les risques et la capacité de remboursement de l'État","Uniquement la couleur de la monnaie utilisée","Son impact sur la dette publique"],"ex":"Il faut évaluer le coût, la durée, les risques, la capacité de remboursement et l'impact sur la dette publique."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الرابع: الإيرادات العامة (4.4 القروض العامة).","fr":"Note de révision jointe, section 4 : Les recettes publiques (4.4 emprunts publics)."},"cat":"tr"},{"id":72,"pts":1,"a":[0],"ar":{"q":"الإفراط في الإصدار النقدي كوسيلة لتمويل العجز يؤدي غالبًا إلى:","o":["تراجع القوة الشرائية والتضخم","زيادة القيمة الشرائية للعملة","خفض الأسعار حتمًا","لا يوجد أي أثر اقتصادي"],"ex":"الإفراط في الإصدار النقدي قد يؤدي إلى التضخم وتراجع القوة الشرائية واختلال التوازن النقدي."},"fr":{"q":"Un excès de création monétaire pour financer le déficit conduit généralement à :","o":["Une baisse du pouvoir d'achat et de l'inflation","Une hausse du pouvoir d'achat de la monnaie","Une baisse certaine des prix","Aucun effet économique"],"ex":"L'excès d'émission monétaire peut entraîner l'inflation et la baisse du pouvoir d'achat."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الرابع: الإيرادات العامة (4.5 الإصدار النقدي).","fr":"Note de révision jointe, section 4 : Les recettes publiques (4.5 émission monétaire)."},"cat":"mf"},{"id":73,"pts":2,"a":[0,2,3],"ar":{"q":"من خصائص الضريبة:","o":["نقدية في الأصل وإلزامية","اختيارية يمكن للمكلف رفضها","نهائية وقانونية","غير مرتبطة بخدمة فردية مباشرة"],"ex" e ou financière","Disciplinaire ou pénale","Aucune responsabilité","Proportionnée à la nature du fait, du préjudice et de l'intention"],"ex":"La responsabilité peut être administrative, financière, disciplinaire ou pénale, proportionnée au fait et au préjudice."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم التاسع: المحاسبة العمومية (9.3 المسؤولية).","fr":"Note de révision jointe, section 9 : La comptabilité publique (9.3 responsabilité)."},"cat":"cc"},{"id":91,"pts":1,"a":[1],"ar":{"q":"الرقابة المرافقة على المال العام تمارس:","o":["قبل الالتزام أو الدفع","أثناء تنفيذ العملية لمتابعة الالتزامات والإنجاز والسيولة","بعد إتمام العملية فقط","خارج الإدارة حصريًا"],"ex":"الرقابة المرافقة تمارس أثناء التنفيذ لمتابعة الالتزامات والإنجاز والسيولة، بخلاف الرقابة السابقة واللاحقة."},"fr":{"q":"Le contrôle d'accompagnement des deniers publics s'exerce :","o":["Avant l'engagement ou le paiement","Pendant l'exécution, pour suivre les engagements, la réalisation et la liquidité","Uniquement après l'opération","Exclusivement hors de l'administration"],"ex":"Le contrôle d'accompagnement s'exerce pendant l'exécution pour suivre les engagements et la liquidité."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم العاشر: الرقابة على المال العام.","fr":"Note de révision jointe, section 10 : Le contrôle des deniers publics."},"cat":"cc"},{"id":92,"pts":2,"a":[0,1,3],"ar":{"q":"تقوم الصفقة العمومية على مبادئ:","o":["المنافسة والمساواة بين المتنافسين","الشفافية وحرية الوصول","تفضيل مقاول واحد دون غيره دائمًا","حسن استعمال المال العام"],"ex":"تقوم الصفقة العمومية على المنافسة والمساواة والشفافية وحرية الوصول وحسن استعمال المال العام."},"fr":{"q":"Le marché public repose sur des principes :","o":["La concurrence et l'égalité entre candidats","La transparence et la liberté d'accès","La préférence systématique pour un seul entrepreneur","Le bon usage des deniers publics"],"ex":"Le marché public repose sur la concurrence, l'égalité, la transparence et le bon usage des deniers publics."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الحادي عشر: الصفقات العمومية.","fr":"Note de révision jointe, section 11 : Les marchés publics."},"cat":"mp"},{"id":93,"pts":2,"a":[0,1,3],"ar":{"q":"من المخاطر التي ينبغي تجنبها في الصفقات العمومية:","o":["تجزئة الطلب للتحايل على الحدود","تضارب المصالح","الإعلان المسبق عن الحاجة","تغيير الشروط بعد المنافسة"],"ex":"من المخاطر: تجزئة الطلب للتحايل، وتضارب المصالح، وتغيير الشروط بعد المنافسة، وقبول أشغال غير منجزة."},"fr":{"q":"Parmi les risques à éviter dans les marchés publics :","o":["Le fractionnement de la commande pour contourner les seuils","Le conflit d'intérêts","La publicité préalable du besoin","La modification des conditions après la mise en concurrence"],"ex":"Les risques incluent le fractionnement de la commande, le conflit d'intérêts et la modification des conditions après concurrence."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الحادي عشر: الصفقات العمومية.","fr":"Note de révision jointe, section 11 : Les marchés publics."},"cat":"mp"},{"id":94,"pts":1,"a":[1],"ar":{"q":"تحسب نسبة تنفيذ الميزانية بالصيغة:","o":["المعتمد ÷ المنفذ × 100","المنفذ ÷ المعتمد × 100","النفقات − الإيرادات","نفقات الاستثمار ÷ إجمالي النفقات"],"ex":"نسبة التنفيذ = المنفذ ÷ المعتمد × 100، وتدل على مدى تحويل الترخيص إلى إنجاز فعلي."},"fr":{"q":"Le taux d'exécution budgétaire se calcule par la formule :","o":["Crédit voté ÷ montant exécuté × 100","Montant exécuté ÷ crédit voté × 100","Dépenses − recettes","Dépenses d'investissement ÷ total des dépenses"],"ex":"Le taux d'exécution = exécuté ÷ crédit voté × 100, indiquant la conversion de l'autorisation en réalisation."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الثاني عشر: قراءة المؤشرات المالية.","fr":"Note de révision jointe, section 12 : Lecture des indicateurs financiers."},"cat":"calc"},{"id":95,"pts":1,"a":[0],"ar":{"q":"حصة الاستثمار في الميزانية تقاس بـ:","o":["نفقات الاستثمار ÷ إجمالي النفقات","خدمة الدين ÷ الإيرادات","النفقات − الإيرادات","المنفذ ÷ المعتمد × 100"],"ex":"حصة الاستثمار = نفقات الاستثمار ÷ إجمالي النفقات، وتدل على أولوية تكوين الأصول والخدمات المستقبلية."},"fr":{"q":"La part de l'investissement dans le budget se mesure par :","o":["Dépenses d'investissement ÷ total des dépenses","Service de la dette ÷ recettes","Dépenses − recettes","Exécuté ÷ crédit voté × 100"],"ex":"La part de l'investissement = dépenses d'investissement ÷ total des dépenses, indiquant la priorité donnée aux actifs futurs."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الثاني عشر: قراءة المؤشرات المالية.","fr":"Note de révision jointe, section 12 : Lecture des indicateurs financiers."},"cat":"calc"},{"id":96,"pts":1,"a":[0],"ar":{"q":"يقاس عبء الدين العام بمؤشر:","o":["خدمة الدين ÷ الإيرادات","نفقات الاستثمار ÷ إجمالي النفقات","المنفذ ÷ المعتمد × 100","الإيرادات − النفقات"],"ex":"يدل عبء الدين (خدمة الدين ÷ الإيرادات) على الضغط على السيولة والقدرة على تمويل البرامج."},"fr":{"q":"Le poids de la dette publique se mesure par l'indicateur :","o":["Service de la dette ÷ recettes","Dépenses d'investissement ÷ total des dépenses","Exécuté ÷ crédit voté × 100","Recettes − dépenses"],"ex":"Le poids de la dette (service de la dette ÷ recettes) indique la pression sur la liquidité et la capacité de financement."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الثاني عشر: قراءة المؤشرات المالية.","fr":"Note de révision jointe, section 12 : Lecture des indicateurs financiers."},"cat":"calc"},{"id":97,"pts":1,"a":[1],"ar":{"q":"المصطلح الفرنسي 'Ordonnancement' يقابله بالعربية:","o":["التصفية","الأمر بالدفع","الالتزام","التحصيل"],"ex":"Ordonnancement تعني الأمر بالدفع، وهي المرحلة الثالثة من مراحل تنفيذ النفقة."},"fr":{"q":"Le terme français « Ordonnancement » correspond en arabe à :","o":["La liquidation","L'ordre de payer","L'engagement","Le recouvrement"],"ex":"« Ordonnancement » signifie l'ordre de payer, troisième phase d'exécution de la dépense."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الثالث عشر: مصطلحات فرنسية شائعة.","fr":"Note de révision jointe, section 13 : Termes français courants."},"cat":"cc"},{"id":98,"pts":1,"a":[0],"ar":{"q":"يقابل مصطلح 'Recouvrement' الفرنسي بالعربية:","o":["التحصيل","الدفع","الإصدار","الرقابة الجبائية"],"ex":"Recouvrement تعني التحصيل، وهي المرحلة الأخيرة من تنفيذ الإيراد العام."},"fr":{"q":"Le terme « Recouvrement » correspond en arabe à :","o":["Le recouvrement (encaissement effectif)","Le paiement","L'émission","Le contrôle fiscal"],"ex":"« Recouvrement » désigne l'encaissement effectif, dernière phase de l'exécution de la recette."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الثالث عشر: مصطلحات فرنسية شائعة.","fr":"Note de révision jointe, section 13 : Termes français courants."},"cat":"cc"},{"id":99,"pts":2,"a":[1],"ar":{"q":"وصل أمر دفع لمراقب الخزينة مرفقًا بفاتورة دون محضر استلام. الإجراء السليم هو:","o":["الدفع فورًا لأن الفاتورة كافية","طلب استكمال إثبات إنجاز الخدمة قبل الدفع","رفض الملف نهائيًا دون تعليل","تحويل الملف مباشرة إلى البرلمان"],"ex":"وجود الفاتورة وحده لا يثبت تنفيذ الخدمة، فيجب استكمال إثبات الإنجاز (كمحضر الاستلام) قبل الدفع."},"fr":{"q":"Un ordre de paiement parvient au contrôleur du Trésor accompagné d'une facture, sans procès-verbal de réception. La démarche correcte est :","o":["Payer immédiatement car la facture suffit","Demander de compléter la preuve du service fait avant paiement","Rejeter le dossier définitivement sans motivation","Transmettre directement le dossier au Parlement"],"ex":"La seule facture ne prouve pas le service fait ; il faut compléter la preuve de réalisation avant paiement."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الرابع عشر: أسئلة تدريبية نموذجية (14.2 حالات عملية، الحالة الأولى).","fr":"Note de révision jointe, section 14 : Questions d'entraînement (14.2 cas pratiques, cas 1)."},"cat":"dp"},{"id":100,"pts":2,"a":[1],"ar":{"q":"تبين أن الاعتماد المتاح أقل من مبلغ الالتزام المطلوب. الإجراء الصحيح هو:","o":["الالتزام والدفع رغم تجاوز الاعتماد لضمان استمرار الخدمة","عدم الالتزام أو الدفع بما يتجاوز الاعتماد المرخص والرجوع للجهة المختصة","تحويل الفارق من حساب شخصي للآمر بالصرف","تجاهل الموضوع لأنه لا يؤثر على القانون"],"ex":"لا يجوز تجاوز الاعتماد المرخص؛ يجب الرجوع إلى الجهة المختصة لمعالجة الوضع وفق قواعد النقل أو إعادة التوزيع إن سمح القانون."},"fr":{"q":"Il s'avère que le crédit disponible est inférieur au montant de l'engagement demandé. La démarche correcte est :","o":["Engager et payer malgré le dépassement du crédit pour assurer la continuité du service","Ne pas engager ni payer au-delà du crédit autorisé et saisir l'autorité compétente","Transférer la différence depuis un compte personnel de l'ordonnateur","Ignorer la question car cela n'a pas d'incidence légale"],"ex":"Il est interdit de dépasser le crédit autorisé ; il faut saisir l'autorité compétente selon les règles de virement ou de redéploiement."},"legal":{"ar":"المذكرة المرجعية المرفقة، القسم الرابع عشر: أسئلة تدريبية نموذجية (14.2 حالات عملية، الحالة الثانية).","fr":"Note de révision jointe, section 14 : Questions d'entraînement (14.2 cas pratiques, cas 2)."},"cat":"dp"},{"id":101,"pts":2,"a":[1],"cat":"calc","ar":{"q":"بلغ الاعتماد المفتوح لأحد الفصول 4,000,000 أوقية، وتم الالتزام بمبلغ 3,100,000 أوقية إلى غاية نهاية الشهر التاسع. ما نسبة تنفيذ هذا الفصل؟","o":["70%","77.5%","82%","90%"],"ex":"نسبة التنفيذ = (الالتزام ÷ الاعتماد) × 100 = (3,100,000 ÷ 4,000,000) × 100 = 77.5%."},"fr":{"q":"Une ligne budgétaire dispose d'un crédit ouvert de 4 000 000 MRU ; 3 100 000 MRU ont été engagés à la fin du 9e mois. Quel est le taux d'exécution de cette ligne ?","o":["70%","77,5%","82%","90%"],"ex":"Taux d'exécution = (engagement ÷ crédit) × 100 = (3 100 000 ÷ 4 000 000) × 100 = 77,5 %."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":102,"pts":1,"a":[2],"cat":"calc","ar":{"q":"يتوفر فصل ميزانياتي على اعتماد قدره 900,000 أوقية. سبق أن التُزم بمبلغ 520,000 أوقية ودُفع منه فعليًا 300,000 أوقية. ما هو الرصيد المتبقي المتاح للالتزام الجديد؟","o":["600,000 أوقية","520,000 أوقية","380,000 أوقية","300,000 أوقية"],"ex":"الرصيد المتاح للالتزام = الاعتماد الكلي − الالتزامات السابقة = 900,000 − 520,000 = 380,000 أوقية (الدفع لا يُخصم مرتين لأنه جزء من الالتزام القائم)."},"fr":{"q":"Une ligne budgétaire dispose d'un crédit de 900 000 MRU. 520 000 MRU ont déjà été engagés, dont 300 000 MRU effectivement payés. Quel est le solde disponible pour un nouvel engagement ?","o":["600 000 MRU","520 000 MRU","380 000 MRU","300 000 MRU"],"ex":"Solde disponible = crédit total − engagements déjà pris = 900 000 − 520 000 = 380 000 MRU (le paiement fait partie de l'engagement, il n'est pas déduit une seconde fois)."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":103,"pts":1,"a":[1],"cat":"calc","ar":{"q":"بافتراض معدل ضريبي مطبق على القيمة المضافة قدره 16%، ما هو مبلغ الضريبة المستحقة على فاتورة قيمتها بدون احتساب الضريبة 500,000 أوقية؟","o":["50,000 أوقية","80,000 أوقية","84,000 أوقية","96,000 أوقية"],"ex":"مبلغ الضريبة = المبلغ الخام × المعدل = 500,000 × 0.16 = 80,000 أوقية."},"fr":{"q":"En supposant un taux de TVA de 16 %, quel est le montant de la taxe due sur une facture hors taxe de 500 000 MRU ?","o":["50 000 MRU","80 000 MRU","84 000 MRU","96 000 MRU"],"ex":"Montant de la taxe = montant HT × taux = 500 000 × 0,16 = 80 000 MRU."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":104,"pts":1,"a":[0],"cat":"calc","ar":{"q":"يتقاضى موظف راتبًا شهريًا إجماليًا قدره 180,000 أوقية، ويخضع لاقتطاع إجمالي (ضريبة + مساهمات اجتماعية) بنسبة 15%. ما هو صافي الراتب الذي يتقاضاه؟","o":["153,000 أوقية","165,000 أوقية","162,000 أوقية","170,000 أوقية"],"ex":"صافي الراتب = الراتب الإجمالي × (1 − نسبة الاقتطاع) = 180,000 × 0.85 = 153,000 أوقية."},"fr":{"q":"Un agent perçoit un salaire brut mensuel de 180 000 MRU, soumis à une retenue globale (impôt + cotisations sociales) de 15 %. Quel est son salaire net ?","o":["153 000 MRU","165 000 MRU","162 000 MRU","170 000 MRU"],"ex":"Salaire net = salaire brut × (1 − taux de retenue) = 180 000 × 0,85 = 153 000 MRU."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":105,"pts":2,"a":[3],"cat":"calc","ar":{"q":"التحق موظف بالخدمة في 16 من الشهر. إذا كان راتبه الشهري الكامل 150,000 أوقية والشهر يتكون من 30 يومًا، فما المبلغ المستحق له عن ذلك الشهر (على أساس التناسب الزمني)؟","o":["150,000 أوقية","100,000 أوقية","50,000 أوقية","75,000 أوقية"],"ex":"عدد أيام الخدمة الفعلية = 30 − 16 + 1 = 15 يومًا. المبلغ المستحق = (150,000 ÷ 30) × 15 = 75,000 أوقية."},"fr":{"q":"Un agent est recruté le 16 du mois. Si son salaire mensuel plein est de 150 000 MRU et que le mois compte 30 jours, quel montant lui est dû pour ce mois (au prorata temporis) ?","o":["150 000 MRU","100 000 MRU","50 000 MRU","75 000 MRU"],"ex":"Jours de service effectifs = 30 − 16 + 1 = 15 jours. Montant dû = (150 000 ÷ 30) × 15 = 75 000 MRU."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":106,"pts":1,"a":[2],"cat":"calc","ar":{"q":"بلغت النفقات الفعلية لمشروع استثماري 12,600,000 أوقية من أصل ميزانية إجمالية مخصصة قدرها 18,000,000 أوقية. ما نسبة الإنجاز المالي للمشروع؟","o":["60%","65%","70%","75%"],"ex":"نسبة الإنجاز = (النفقات الفعلية ÷ الميزانية الإجمالية) × 100 = (12,600,000 ÷ 18,000,000) × 100 = 70%."},"fr":{"q":"Les dépenses réelles d'un projet d'investissement s'élèvent à 12 600 000 MRU sur un budget total alloué de 18 000 000 MRU. Quel est le taux de réalisation financière du projet ?","o":["60%","65%","70%","75%"],"ex":"Taux de réalisation = (dépenses réelles ÷ budget total) × 100 = (12 600 000 ÷ 18 000 000) × 100 = 70 %."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":107,"pts":1,"a":[1],"cat":"calc","ar":{"q":"تبلغ نفقات التجهيز (الاستثمار) في ميزانية إحدى الإدارات 45,000,000 أوقية من إجمالي ميزانية قدرها 150,000,000 أوقية. ما هي حصة الاستثمار من الميزانية الإجمالية؟","o":["25%","30%","35%","40%"],"ex":"حصة الاستثمار = (نفقات الاستثمار ÷ الميزانية الإجمالية) × 100 = (45,000,000 ÷ 150,000,000) × 100 = 30%."},"fr":{"q":"Les dépenses d'équipement (investissement) d'une administration s'élèvent à 45 000 000 MRU sur un budget total de 150 000 000 MRU. Quelle est la part de l'investissement dans le budget total ?","o":["25%","30%","35%","40%"],"ex":"Part de l'investissement = (dépenses d'investissement ÷ budget total) × 100 = (45 000 000 ÷ 150 000 000) × 100 = 30 %."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":108,"pts":2,"a":[0],"cat":"calc","ar":{"q":"بلغت أرصدة الدين العام لدولة ما 320 مليار أوقية، في حين بلغ الناتج المحلي الإجمالي 1,600 مليار أوقية. ما هي نسبة الدين العام إلى الناتج المحلي الإجمالي؟","o":["20%","25%","32%","40%"],"ex":"نسبة عبء الدين = (رصيد الدين ÷ الناتج المحلي الإجمالي) × 100 = (320 ÷ 1600) × 100 = 20%."},"fr":{"q":"L'encours de la dette publique d'un État s'élève à 320 milliards MRU, pour un PIB de 1 600 milliards MRU. Quel est le ratio dette publique / PIB ?","o":["20%","25%","32%","40%"],"ex":"Ratio d'endettement = (encours de la dette ÷ PIB) × 100 = (320 ÷ 1600) × 100 = 20 %."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":109,"pts":1,"a":[3],"cat":"calc","ar":{"q":"منحت الخزينة تسبيقًا لأحد المتعاقدين بمبلغ 2,000,000 أوقية، مقابل ضمان بنكي وفائدة سنوية بسيطة قدرها 6%. ما مقدار الفائدة المستحقة بعد 6 أشهر؟","o":["120,000 أوقية","100,000 أوقية","80,000 أوقية","60,000 أوقية"],"ex":"الفائدة البسيطة لنصف سنة = رأس المال × المعدل السنوي × (المدة/12) = 2,000,000 × 0.06 × (6/12) = 60,000 أوقية."},"fr":{"q":"Le Trésor a accordé une avance de 2 000 000 MRU à un cocontractant, contre garantie bancaire et intérêt simple annuel de 6 %. Quel est le montant de l'intérêt dû après 6 mois ?","o":["120 000 MRU","100 000 MRU","80 000 MRU","60 000 MRU"],"ex":"Intérêt simple pour 6 mois = capital × taux annuel × (durée/12) = 2 000 000 × 0,06 × (6/12) = 60 000 MRU."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":110,"pts":1,"a":[1],"cat":"calc","ar":{"q":"بلغت الإيرادات الجبائية المحصَّلة فعليًا 780,000,000 أوقية، بينما كانت التوقعات المقدرة في قانون المالية 900,000,000 أوقية. ما نسبة تحصيل الإيرادات مقارنة بالتوقعات؟","o":["80%","86.7%","90%","95%"],"ex":"نسبة التحصيل = (المحصَّل فعليًا ÷ المتوقع) × 100 = (780,000,000 ÷ 900,000,000) × 100 ≈ 86.7%."},"fr":{"q":"Les recettes fiscales effectivement recouvrées s'élèvent à 780 000 000 MRU, contre des prévisions de la loi de finances de 900 000 000 MRU. Quel est le taux de recouvrement par rapport aux prévisions ?","o":["80%","86,7%","90%","95%"],"ex":"Taux de recouvrement = (recettes recouvrées ÷ prévisions) × 100 = (780 000 000 ÷ 900 000 000) × 100 ≈ 86,7 %."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":111,"pts":2,"a":[2],"cat":"calc","ar":{"q":"وصلت لمراقب الخزينة سندات التزام بقيم التالية: 1,200,000 و850,000 و640,000 أوقية على فصل يتوفر على اعتماد متبقٍ قدره 2,500,000 أوقية. أي سند من هذه السندات، إذا التُزم بها بنفس الترتيب، سيتجاوز به الاعتماد المتاح؟","o":["السند الأول (1,200,000)","السند الثاني (850,000)","السند الثالث (640,000)","لا أحد منها يتجاوز الاعتماد"],"ex":"المجموع التراكمي: بعد الأول 1,200,000 (المتبقي 1,300,000)، بعد الثاني 2,050,000 (المتبقي 450,000)، والثالث يطلب 640,000 وهو أكبر من المتبقي 450,000، فيتجاوز الاعتماد المتاح."},"fr":{"q":"Un contrôleur du Trésor reçoit des titres d'engagement de 1 200 000, 850 000 et 640 000 MRU sur une ligne disposant d'un crédit résiduel de 2 500 000 MRU. En les engageant dans cet ordre, quel titre dépassera le crédit disponible ?","o":["Le 1er titre (1 200 000)","Le 2e titre (850 000)","Le 3e titre (640 000)","Aucun ne dépasse le crédit"],"ex":"Cumul : après le 1er, 1 200 000 (reste 1 300 000) ; après le 2e, 2 050 000 (reste 450 000) ; le 3e demande 640 000, supérieur au reste 450 000 : il dépasse le crédit disponible."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":112,"pts":1,"a":[0],"cat":"calc","ar":{"q":"أُبرمت صفقة عمومية بمبلغ 8,000,000 أوقية، ونُص فيها على تسبيق بنسبة 15% من المبلغ الإجمالي مقابل ضمان بنكي. ما هو مبلغ هذا التسبيق؟","o":["1,200,000 أوقية","1,000,000 أوقية","1,500,000 أوقية","800,000 أوقية"],"ex":"مبلغ التسبيق = المبلغ الإجمالي × النسبة = 8,000,000 × 0.15 = 1,200,000 أوقية."},"fr":{"q":"Un marché public est conclu pour un montant de 8 000 000 MRU, avec une avance de 15 % du montant total contre garantie bancaire. Quel est le montant de cette avance ?","o":["1 200 000 MRU","1 000 000 MRU","1 500 000 MRU","800 000 MRU"],"ex":"Montant de l'avance = montant total × taux = 8 000 000 × 0,15 = 1 200 000 MRU."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":113,"pts":1,"a":[2],"cat":"calc","ar":{"q":"ارتفعت النفقات العمومية لسنة معينة من 240 مليار أوقية إلى 264 مليار أوقية مقارنة بالسنة السابقة. ما هي نسبة الزيادة؟","o":["8%","9%","10%","12%"],"ex":"نسبة الزيادة = ((264 − 240) ÷ 240) × 100 = (24 ÷ 240) × 100 = 10%."},"fr":{"q":"Les dépenses publiques sont passées de 240 milliards MRU à 264 milliards MRU d'une année sur l'autre. Quel est le taux d'augmentation ?","o":["8%","9%","10%","12%"],"ex":"Taux d'augmentation = ((264 − 240) ÷ 240) × 100 = (24 ÷ 240) × 100 = 10 %."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":114,"pts":1,"a":[1],"cat":"calc","ar":{"q":"يرفق أمر بالصرف بفاتورة بمبلغ 3,540,000 أوقية شاملة الضريبة على القيمة المضافة بمعدل 18%. ما هو المبلغ الخام (بدون احتساب الضريبة) لهذه الفاتورة؟","o":["2,900,000 أوقية","3,000,000 أوقية","3,100,000 أوقية","3,200,000 أوقية"],"ex":"المبلغ الخام = المبلغ شامل الضريبة ÷ (1 + المعدل) = 3,540,000 ÷ 1.18 = 3,000,000 أوقية."},"fr":{"q":"Un ordre de paiement est accompagné d'une facture de 3 540 000 MRU TTC, avec une TVA de 18 %. Quel est le montant hors taxe de cette facture ?","o":["2 900 000 MRU","3 000 000 MRU","3 100 000 MRU","3 200 000 MRU"],"ex":"Montant HT = montant TTC ÷ (1 + taux) = 3 540 000 ÷ 1,18 = 3 000 000 MRU."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":115,"pts":2,"a":[3],"cat":"calc","ar":{"q":"يتوفر باب من أبواب الميزانية على اعتماد سنوي قدره 6,000,000 أوقية موزع بالتساوي على 12 شهرًا في شكل اثني عشريات مؤقتة. ما هو الحد الأقصى للنفقة المسموح بها خلال الأشهر الثلاثة الأولى من السنة، في غياب قانون مالية نهائي؟","o":["6,000,000 أوقية","3,000,000 أوقية","2,000,000 أوقية","1,500,000 أوقية"],"ex":"قيمة الاثني عشرية الواحدة = 6,000,000 ÷ 12 = 500,000 أوقية شهريًا. لثلاثة أشهر: 500,000 × 3 = 1,500,000 أوقية."},"fr":{"q":"Un chapitre budgétaire dispose d'un crédit annuel de 6 000 000 MRU, réparti à parts égales sur 12 mois sous forme de douzièmes provisoires. Quelle est la dépense maximale autorisée pour les trois premiers mois, en l'absence de loi de finances définitive ?","o":["6 000 000 MRU","3 000 000 MRU","2 000 000 MRU","1 500 000 MRU"],"ex":"Un douzième = 6 000 000 ÷ 12 = 500 000 MRU par mois. Pour trois mois : 500 000 × 3 = 1 500 000 MRU."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":116,"pts":1,"a":[1],"cat":"mp","ar":{"q":"تهدف لجنة فتح الأظرفة في الصفقات العمومية أساسًا إلى:","o":["اختيار العارض الفائز نهائيًا","التحقق العلني من استيفاء العروض للشكليات المطلوبة قبل التقييم","تحديد سعر السوق","إعداد دفتر الشروط"],"ex":"لجنة فتح الأظرفة تتحقق من اكتمال الوثائق شكليًا وتسجل العروض علنًا، أما التقييم والمفاضلة فيتم لاحقًا من طرف لجنة أو جهة مختصة."},"fr":{"q":"L'ouverture des plis dans un marché public vise essentiellement à :","o":["Désigner définitivement l'attributaire","Vérifier publiquement la conformité formelle des offres avant évaluation","Fixer le prix du marché","Rédiger le cahier des charges"],"ex":"La commission d'ouverture des plis constate publiquement la complétude formelle des dossiers ; l'évaluation et la comparaison des offres interviennent ensuite."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":117,"pts":2,"a":[0,2],"cat":"mp","ar":{"q":"من أنواع الضمانات المرتبطة بالصفقات العمومية:","o":["ضمان حسن التنفيذ","ضمان البطالة","الضمان الاحتياطي عن التسبيق","ضمان التقاعد"],"ex":"من أبرز الضمانات: ضمان حسن التنفيذ (لضمان تنفيذ الالتزامات التعاقدية) والضمان المرتبط باسترداد التسبيقات الممنوحة."},"fr":{"q":"Parmi les garanties associées aux marchés publics figurent :","o":["La garantie de bonne exécution","La garantie chômage","La garantie de restitution d'avance","La garantie de retraite"],"ex":"Les garanties usuelles sont notamment la garantie de bonne exécution (exécution des engagements contractuels) et la garantie liée au remboursement des avances accordées."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":118,"pts":1,"a":[3],"cat":"mp","ar":{"q":"الفرق الأساسي بين طلب العروض المفتوح وطلب العروض المحدود يكمن في:","o":["مبلغ الصفقة فقط","مدة تنفيذ الصفقة","طبيعة السلعة أو الخدمة","إمكانية مشاركة أي متنافس مؤهل في المفتوح، مقابل دعوة عدد محدود مسبقًا من المتنافسين في المحدود"],"ex":"طلب العروض المفتوح متاح لكل من يستوفي الشروط، بينما طلب العروض المحدود يقتصر على قائمة من المتنافسين تُختار مسبقًا."},"fr":{"q":"La différence essentielle entre l'appel d'offres ouvert et l'appel d'offres restreint réside dans :","o":["Le seul montant du marché","La durée d'exécution du marché","La nature du bien ou service","La possibilité pour tout candidat qualifié de participer dans l'ouvert, contre une liste restreinte de candidats présélectionnés dans le restreint"],"ex":"L'appel d'offres ouvert est accessible à tout candidat remplissant les conditions, tandis que l'appel d'offres restreint se limite à une liste de candidats présélectionnés."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":119,"pts":1,"a":[2],"cat":"mp","ar":{"q":"الغرض الرئيسي من دفتر الشروط (أو دفتر البنود الخاصة) في الصفقة العمومية هو:","o":["تحديد الجزاء الضريبي على المقاول","تحديد سعر السوق العالمي","تحديد الالتزامات التقنية والمالية والتعاقدية بين الإدارة والمتعاقد","إلغاء الحاجة إلى المنافسة"],"ex":"دفتر الشروط يحدد بدقة موضوع الصفقة وشروط تنفيذها والالتزامات المتبادلة بين الطرفين."},"fr":{"q":"L'objet principal du cahier des charges dans un marché public est de :","o":["Fixer la sanction fiscale de l'entrepreneur","Fixer le prix du marché mondial","Définir les obligations techniques, financières et contractuelles entre l'administration et le titulaire","Supprimer le besoin de mise en concurrence"],"ex":"Le cahier des charges précise l'objet du marché, ses conditions d'exécution et les obligations réciproques des parties."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":120,"pts":2,"a":[1],"cat":"mp","ar":{"q":"عند تنفيذ صفقة أشغال، تُدفع مستحقات المقاول عادة على أساس:","o":["مبلغ الصفقة الإجمالي دفعة واحدة عند التوقيع","محاضر معاينة تقدم الأشغال (الحالات التقديمية) المصادق عليها","تقدير شخصي من المحاسب العمومي","متوسط أسعار السوق وقت الدفع"],"ex":"تُصرف مستحقات الأشغال تدريجيًا وفق حالات تقدم الأشغال (décomptes) المثبتة والمصادق عليها من المصلحة المستفيدة."},"fr":{"q":"Dans l'exécution d'un marché de travaux, les droits de l'entrepreneur sont généralement payés sur la base :","o":["Du montant total du marché en une seule fois à la signature","Des décomptes d'avancement des travaux, constatés et validés","D'une estimation personnelle du comptable public","Du prix moyen du marché au moment du paiement"],"ex":"Les paiements de travaux s'effectuent progressivement selon les décomptes d'avancement, constatés et validés par le service bénéficiaire."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":121,"pts":1,"a":[0],"cat":"mp","ar":{"q":"يُقصد بمبدأ \"المساواة بين المتنافسين\" في الصفقات العمومية:","o":["منح جميع المتنافسين نفس المعلومات وذات الفرص للتنافس دون تمييز","إلزام جميع المتنافسين بتقديم نفس السعر","تقسيم الصفقة بالتساوي بين المتنافسين","اختيار المتنافسين بالقرعة حصرًا"],"ex":"مبدأ المساواة يضمن معاملة موحدة لجميع المتنافسين من حيث المعلومات والشروط وآجال التقديم."},"fr":{"q":"Le principe d'égalité entre les candidats dans les marchés publics signifie :","o":["Donner à tous les candidats la même information et les mêmes chances de concourir sans discrimination","Obliger tous les candidats à proposer le même prix","Répartir le marché à parts égales entre les candidats","Choisir les candidats uniquement par tirage au sort"],"ex":"Le principe d'égalité garantit un traitement uniforme de tous les candidats en matière d'information, de conditions et de délais de soumission."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":122,"pts":1,"a":[1],"cat":"dr","ar":{"q":"الإعفاء الضريبي يعني:","o":["تخفيض معدل الضريبة فقط دون إسقاطها","إسقاط الالتزام بأداء الضريبة كليًا أو جزئيًا بموجب نص قانوني صريح","تأجيل موعد أداء الضريبة فقط","تحويل الضريبة إلى شخص آخر"],"ex":"الإعفاء الضريبي هو استثناء قانوني يُسقط عبء الضريبة عن مكلف أو نشاط معين بنص صريح."},"fr":{"q":"L'exonération fiscale signifie :","o":["Une simple réduction du taux d'imposition","La suppression totale ou partielle de l'obligation fiscale en vertu d'un texte exprès","Un simple report de la date de paiement","Le transfert de l'impôt à une autre personne"],"ex":"L'exonération est une dérogation légale qui supprime la charge fiscale pour un contribuable ou une activité donnée, en vertu d'un texte exprès."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":123,"pts":1,"a":[2],"cat":"dr","ar":{"q":"يُقصد بالوعاء الضريبي (Assiette de l'impôt):","o":["نسبة الضريبة المطبقة","الجهة المكلفة بتحصيل الضريبة","المادة أو العنصر الذي تُفرض عليه الضريبة ويُحدد على أساسه مقدارها","تاريخ استحقاق الضريبة"],"ex":"الوعاء الضريبي هو العنصر الخاضع للضريبة (الدخل، رقم الأعمال، الملكية...) الذي يُحسب على أساسه مبلغها."},"fr":{"q":"L'assiette de l'impôt désigne :","o":["Le taux d'imposition appliqué","L'organe chargé du recouvrement","La matière ou l'élément sur lequel l'impôt est établi et son montant calculé","La date d'exigibilité de l'impôt"],"ex":"L'assiette est l'élément imposable (revenu, chiffre d'affaires, patrimoine...) servant de base au calcul du montant de l'impôt."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":124,"pts":2,"a":[0,3],"cat":"dr","ar":{"q":"من طرق تحصيل الضرائب المعتمدة عمومًا:","o":["الاقتطاع من المنبع","المقايضة العينية","التحصيل المباشر عن طريق قابض أو محاسب مختص","الدفع التلقائي (الإقرار الذاتي) مع أداء المبلغ المصرح به"],"ex":"من طرق التحصيل الشائعة: الاقتطاع من المنبع، التحصيل المباشر من طرف القابض، والدفع التلقائي المرتبط بالإقرار الضريبي."},"fr":{"q":"Parmi les modes de recouvrement de l'impôt généralement admis :","o":["La retenue à la source","Le troc en nature","Le recouvrement direct par un receveur ou comptable compétent","Le paiement spontané (déclaration) accompagné du versement déclaré"],"ex":"Modes courants : retenue à la source, recouvrement direct par le receveur, et paiement spontané lié à la déclaration fiscale."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":125,"pts":1,"a":[1],"cat":"dr","ar":{"q":"الفرق الجوهري بين الضريبة المباشرة والضريبة غير المباشرة هو أن:","o":["الضريبة المباشرة تُفرض فقط على الشركات","الضريبة المباشرة تُفرض مباشرة على الدخل أو الثروة بصفة دورية، بينما تُفرض غير المباشرة على الاستهلاك أو التداول","الضريبة غير المباشرة تُفرض على الدخل فقط","لا فرق جوهريًا بينهما"],"ex":"الضريبة المباشرة (كالضريبة على الدخل) تصيب المكلف مباشرة وبصفة دورية، أما غير المباشرة (كالضريبة على القيمة المضافة) فتُفرض على عمليات الاستهلاك أو التداول وتنتقل عبء تحمّلها."},"fr":{"q":"La différence fondamentale entre impôt direct et impôt indirect est que :","o":["L'impôt direct ne vise que les sociétés","L'impôt direct frappe directement le revenu ou la fortune de façon périodique, alors que l'indirect frappe la consommation ou la circulation","L'impôt indirect ne vise que le revenu","Il n'existe pas de différence fondamentale"],"ex":"L'impôt direct (ex. impôt sur le revenu) touche directement et périodiquement le contribuable, tandis que l'indirect (ex. TVA) frappe les opérations de consommation ou de circulation et peut être répercuté."},"legal":{"ar":"تمرين تطبيقي يعتمد على قواعد الحساب المالي العامة وليس على نص قانوني محدد.","fr":"Exercice pratique fondé sur les règles générales de calcul financier, sans référence à un article précis."}},{"id":126,"pts":1,"a":[0],"cat":"tr","ar":{"q":"من أهداف إعداد خطة الخزينة الشهرية بشكل أساسي:","o":["التنبؤ بالتدفقات النقدية الداخلة والخارجة لضمان توفر السيولة الكافية في الوقت المناسب","تحديد الأجور السنوية للموظفين","إعداد قانون المالية","تحديد سعر صرف العملة"],"ex":"خطة الخزينة أداة تدبير تسمح بمقارنة الموارد المتوقعة بالنفقات المرتقبة لتفادي عجز السيولة أو تراكم أرصدة غير مستغلة."},"fr":{"q":"L'un des objectifs essentiels de l'élaboration du plan de trésorerie mensuel est de :","o":["Prévoir les flux de trésorerie entran function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

function padPool(pool, n){
  if(pool.length===0) return [];
  let out = shuffle(pool);
  while(out.length < n){
    let extra = shuffle(pool);
    if(out.length && extra.length>1 && extra[0].id===out[out.length-1].id){
      [extra[0],extra[1]] = [extra[1],extra[0]];
    }
    out = out.concat(extra);
  }
  return out.slice(0,n);
}

function buildPool(){
  if(mode==='quick'){
    const base = QUESTIONS.filter(q=>q.cat===domainSel);
    return padPool(base, MODE_META.quick.count);
  }
  const n = MODE_META[mode].count;
  return shuffle(QUESTIONS).slice(0,n);
}

function makeAttempt(list){
  return shuffle(list).map((q,i)=>{
    const opts = shuffle(q[lang].o.map((text,i)=>({text,i})));
    return {...q, uid:q.id+'-'+i+'-'+Math.random().toString(36).slice(2,7), opts, correct: opts.map((o,n)=>q.a.includes(o.i)?n:null).filter(n=>n!==null)};
  });
}

function startExam(){
  attempt = makeAttempt(buildPool());
  answers={}; idx=0;
  seconds = MODE_META[mode].minutes*60;
  phase='exam'; pending=false;
  clearInterval(timer);
  timer=setInterval(()=>{
    seconds--;
    if(seconds<=0){ seconds=0; clearInterval(timer); phase='review'; render(); }
    else if(seconds%5===0) renderRail();
  },1000);
  render();
}

function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function history(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}

function formatMark(v){
  const n=Math.round(v*100)/100;
  if(n===0)return '0';
  return (n>0?'+':'')+n.toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
}
function optionMark(q,n){
  const correctCount=q.correct.length;
  const wrongCount=q.opts.length-correctCount;
  if(q.correct.includes(n)) return q.pts/correctCount;
  return wrongCount?-(q.pts/wrongCount):0;
}
function questionScore(q,chosen){ return chosen.reduce((sum,n)=>sum+optionMark(q,n),0); }
function isFullyCorrect(q,chosen){
  return chosen.length===q.correct.length && chosen.every(x=>q.correct.includes(x));
}

function modeLabel(t){
  if(mode==='quick') return t.modeQuick+' · '+(CATS[domainSel]?.[lang]||'');
  if(mode==='pro') return t.modePro;
  return t.modeFull;
}

function readinessTier(pct,t){
  if(pct>=85) return {label:t.tierGreat, cls:'tier-great'};
  if(pct>=70) return {label:t.tierGood, cls:'tier-good'};
  if(pct>=50) return {label:t.tierMid, cls:'tier-mid'};
  return {label:t.tierLow, cls:'tier-low'};
}

function saveResult(){
  const raw=attempt.reduce((s,q)=>s+questionScore(q,answers[q.uid]||[]),0);
  const max=attempt.reduce((s,q)=>s+q.pts,0);
  const details=attempt.map(q=>{
    const chosen=answers[q.uid]||[];
    const qs=questionScore(q,chosen);
    return {
      id:q.id, cat:q.cat, q:q[lang].q, opts:q.opts.map(o=>o.text), correct:q.correct, chosen,
      ex:q[lang].ex, legal:q.legal?.[lang]||'', score:qs, max:q.pts,
      marks:q.opts.map((o,n)=>optionMark(q,n))
    };
  });
  const score=Math.round(raw/max*20*100)/100;
  const pct=Math.round(raw/max*10000)/100;
  const record={date:new Date().toLocaleString(lang==='ar'?'ar-DZ':'fr-FR'), language:lang, mode, domain:domainSel,
    score, max:20, pct, raw, maxRaw:max, total:attempt.length,
    answered:Object.keys(answers).filter(id=>answers[id]?.length).length, details};
  const list=[record,...history()].slice(0,15);
  try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){ /* التخزين المحلي غير متاح، نتابع بدون حفظ السجل */ }
  return record;
}

    +'<button class="mode-card" onclick="selectMode(\'full\')"><span class="micon">🏅</span><span class="mtag">'+MODE_META.full.count+' '+t.qCount+'</span><h3>'+t.fullTitle+'</h3><p>'+t.fullDesc+'</p></button>'
  +'</div>'
  +'<div class="history"><h3>'+t.history+'</h3>'+(hs.length
    ? '<div class="history-list">'+hs.map((h,i)=>'<div class="history-row"><span>'+esc(h.date)+' · '+(h.answered!=null?h.answered:'')+'/'+(h.total||100)+'</span><b>'+formatMark(h.score)+'/20</b><button class="secondary" onclick="viewHistory('+i+')">'+t.viewDetails+'</button></div>').join('')+'</div>'
    : '<p class="micro">'+t.noHistory+'</p>')+'</div>';
}

function domainsScreen(t){
  const cards = CAT_ORDER.map(c=>{
    const n = QUESTIONS.filter(q=>q.cat===c).length;
    return '<button class="domain-card" onclick="chooseDomain(\''+c+'\')"><span class="dicon">'+CATS[c].icon+'</span><span><h4>'+CATS[c][lang]+'</h4><span>'+n+' '+(lang==='ar'?'سؤالًا في القاعدة':'questions en banque')+'</span></span></button>';
  }).join('');
  return '<button class="backlink" onclick="phase=\'landing\';render()">'+(lang==='ar'?'→':'←')+' '+t.back+'</button>'
  +'<div class="domain-panel"><h2>'+t.chooseDomain+'</h2><p class="sub">'+t.quickDesc+'</p><div class="domains">'+cards+'</div></div>';
}

function selectMode(m){
  mode=m;
  if(m==='quick'){ phase='domains'; render(); return; }
  startExam();
}
function chooseDomain(c){ domainSel=c; startExam(); }

function renderRail(){
  const t=T[lang];
  const done=Object.keys(answers).filter(id=>answers[id]?.length).length;
  const qmap=attempt.map((q,i)=>'<button class="'+(i===idx?'current ':'')+(answers[q.uid]?.length?'filled':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');
  const rail='<aside class="rail"><div class="railhead"><span>'+t.review+'<div class="railmode">'+esc(modeLabel(t))+'</div></span><b>'+done+'/'+attempt.length+'</b></div><div class="clock '+(seconds<300?'warn':'')+'">'+fmt(seconds)+'</div>'+(seconds<300?'<p style="font:12px Arial;color:#f1b09c">'+t.warning+'</p>':'')+'<div class="bar"><i style="width:'+(done/attempt.length*100)+'%"></i></div><div class="map">'+qmap+'</div><button class="finish" onclick="finish()">⚑ '+t.finish+'</button></aside>';
  const el=$('.rail'); if(el) el.outerHTML=rail;
}

function exam(t){
  const q=attempt[idx], chosen=answers[q.uid]||[];
  return '<section class="exam"><aside class="rail"></aside><section>'
  +'<div class="qmeta"><span>'+t.q+' '+(idx+1)+' '+t.of+' '+attempt.length+'</span><span class="qbadge">'+esc(modeLabel(t))+'</span><b>'+q.pts+' '+t.pts+'</b></div>'
  +'<div class="question"><h2>'+esc(q[lang].q)+'</h2>'
  +'<div class="opts">'+q.opts.map((o,i)=>'<button class="opt '+(chosen.includes(i)?'sel':'')+'" onclick="toggle('+i+')"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(o.text)+'</span>'+(chosen.includes(i)?'<span class="mark">✓</span>':'')+'</button>').join('')+'</div></div>'
  +'<div class="nav"><button onclick="go('+Math.max(0,idx-1)+')" '+(idx===0?'disabled':'')+'>'+(lang==='ar'?'→ ':'')+t.prev+(lang==='fr'?' →':'')+'</button><span>'+Object.keys(answers).filter(id=>answers[id]?.length).length+'/'+attempt.length+'</span><button onclick="'+(idx===attempt.length-1?'finish()':'go('+Math.min(attempt.length-1,idx+1)+')')+'">'+(idx===attempt.length-1?t.finish:t.next)+(lang==='ar'?' ←':' →')+'</button></div>'
  +'</section></section>';
}

function toggle(i){
  const q=attempt[idx]; let a=answers[q.uid]||[];
  a = a.includes(i) ? a.filter(x=>x!==i) : [...a,i].sort((x,y)=>x-y);
  answers[q.uid]=a; render();
}
function go(i){ idx=i; phase='exam'; render(); }
function finish(){ phase='review'; clearInterval(timer); render(); }

function review(t){
  const done=Object.keys(answers).filter(id=>answers[id]?.length).length;
  return '<section class="review"><div class="eyebrow">'+esc(modeLabel(t))+'</div><h1>'+t.review+'</h1><p>'+done+' '+t.answered+' · '+(attempt.length-done)+' '+t.unanswered+'</p>'
  +'<div class="reviewgrid">'+attempt.map((q,i)=>'<button class="'+(answers[q.uid]?.length?'done':'open')+'" onclick="go('+i+')"><span>'+String(i+1).padStart(2,'0')+'</span><strong>'+(answers[q.uid]?.length?t.answered:t.unanswered)+'</strong><small>'+q.pts+' '+t.pts+'</small></button>').join('')+'</div>'
  +'<div class="actions"><button class="secondary" onclick="go(0)">'+t.back+'</button><button class="primary" onclick="askSubmit()">'+t.submit+'</button></div>'
  +(pending?'<div class="modal"><div class="modalbox"><h2>'+t.submit+'</h2><p>'+t.confirm+'</p><div class="actions"><button class="secondary" onclick="pending=false;render()">'+t.cancel+'</button><button class="primary" onclick="submitFinal()">'+t.confirmBtn+'</button></div></div></div>':'')
  +'</section>';
}

function askSubmit(){ pending=true; render(); }
function submitFinal(){ try{ saveResult(); }catch(e){ /* لا نمنع ظهور النتيجة حتى لو فشل الحفظ */ } pending=false; phase='results'; render(); }

function optionMarkupFrom(d, t){
  const selected=new Set(d.chosen||[]);
  return d.marks.map((m,n)=>'<span class="option-mark '+(selected.has(n)?'selected ':'')+(d.correct.includes(n)?'correct':'incorrect')+'"><b>'+String.fromCharCode(65+n)+'</b><span>'+esc(d.opts[n])+'</span><b class="'+(m>=0?'mark-positive':'mark-negative')+'">'+formatMark(m)+'</b></span>').join('');
}

function historyDetails(t){
  const h=history()[historyViewId];
  if(!h||!h.details) return '<section class="review"><div class="eyebrow">'+t.history+'</div><h1>'+t.details+'</h1><p>'+t.noHistory+'</p><button class="primary" onclick="phase=\'landing\';render()">'+t.close+'</button></section>';
  return '<section class="review"><div class="eyebrow">'+t.history+' · '+esc(h.date)+'</div><h1>'+t.details+'</h1>'
  +'<div class="score" style="display:inline-block;margin-bottom:20px"><strong class="scorevalue">'+formatMark(h.score)+'</strong><span> / 20</span><p class="scorevalue">'+formatMark(h.pct!=null?h.pct:(h.score/20*100))+'%</p></div>'
  +'<div class="history-detail-list">'+h.details.map(d=>'<article class="resultitem '+((d.score||0)>0?'ok':'')+'"><div class="resulttop"><span>'+d.id+'</span><h3>'+esc(d.q)+'</h3><b class="scorevalue" style="font-size:18px">'+formatMark(d.score||0)+' / '+formatMark(d.max||0)+'</b></div><p><b>'+t.ex+':</b> '+esc(d.ex)+'</p><div class="legal-note"><b>'+t.basis+':</b> '+esc(d.legal||'')+'</div><div class="answers"><strong>'+t.marks+':</strong><div class="option-review">'+optionMarkupFrom(d,t)+'</div></div></article>').join('')+'</div>'
  +'<div class="actions"><button class="primary" onclick="phase=\'landing\';render()">'+t.close+'</button></div></section>';
}

function results(t){
  const max=attempt.reduce((s,q)=>s+q.pts,0);
  const raw=attempt.reduce((s,q)=>s+questionScore(q,answers[q.uid]||[]),0);
  const score=Math.round(raw/max*20*100)/100;
  const pct=Math.round(raw/max*10000)/100;
  const wrongCount = attempt.filter(q=>!isFullyCorrect(q, answers[q.uid]||[])).length;
  const tier = readinessTier(pct, t);
  return '<section class="results"><aside class="score"><div class="eyebrow">'+esc(modeLabel(t))+'</div><h1>'+t.result+'</h1>'
  +'<strong class="scorevalue">'+formatMark(score)+'</strong><span> / 20</span>'
  +'<div class="tier '+tier.cls+'"><div style="font-size:11px;letter-spacing:.06em;opacity:.85;margin-bottom:4px">'+t.readiness+'</div><div style="font-size:26px;font-weight:800">'+formatMark(pct)+'%</div><div style="margin-top:6px">'+tier.label+'</div></div>'
  +'<div class="actions">'
    +'<button class="primary" onclick="retakeSame()">↻ '+t.again+'</button>'
    +(wrongCount>0 ? '<button class="secondary" onclick="retakeWrong()">'+t.retakeWrong+' ('+wrongCount+')</button>' : '<p class="micro" style="color:#cfe8da">'+t.allCorrect+'</p>')
    +'<button class="secondary" onclick="goHome()">'+t.home+'</button>'
  +'</div></aside>'
  +'<section><div class="qmeta"><h2 style="margin:0;font-size:18px">'+t.details+'</h2><span>'+Object.keys(answers).filter(id=>answers[id]?.length).length+'/'+attempt.length+'</span></div>'
  +attempt.map(q=>{
    const a=answers[q.uid]||[];
    const qs=questionScore(q,a);
    const marks=q.opts.map((o,n)=>optionMark(q,n));
    const markHtml=marks.map((m,n)=>'<span class="option-mark '+(a.includes(n)?'selected ':'')+(q.correct.includes(n)?'correct':'incorrect')+'"><b>'+String.fromCharCode(65+n)+'</b><span>'+esc(q.opts[n].text)+'</span><b class="'+(m>=0?'mark-positive':'mark-negative')+'">'+formatMark(m)+'</b></span>').join('');
    return '<article class="resultitem '+(isFullyCorrect(q,a)?'ok':'')+'"><div class="resulttop"><span>'+q.id+' · '+CATS[q.cat].icon+'</span><h3>'+esc(q[lang].q)+'</h3><b class="scorevalue" style="font-size:18px">'+formatMark(qs)+' / '+formatMark(q.pts)+'</b></div>'
    +'<p><b>'+t.ex+':</b> '+esc(q[lang].ex)+'</p>'
    +'<div class="legal-note"><b>'+t.basis+':</b> '+esc(q.legal?.[lang]||'')+'</div>'
    +'<div class="answers"><strong>'+t.marks+':</strong><div class="option-review">'+markHtml+'</div>'
    +(a.length?'':'<p class="micro" style="margin-top:8px;color:var(--red)">'+t.notAnswered+'</p>')
    +'</div></article>';
  }).join('')+'</section></section>';
}

function retakeSame(){ startExam(); }
function retakeWrong(){
  const wrongIds = new Set(attempt.filter(q=>!isFullyCorrect(q, answers[q.uid]||[])).map(q=>q.id));
  if(!wrongIds.size) return;
  const base = QUESTIONS.filter(q=>wrongIds.has(q.id));
  attempt = makeAttempt(base);
  answers={}; idx=0;
  seconds = Math.max(300, attempt.length*80);
  phase='exam'; pending=false;
  clearInterval(timer);
  timer=setInterval(()=>{
    seconds--;
    if(seconds<=0){ seconds=0; clearInterval(timer); phase='review'; render(); }
    else if(seconds%5===0) renderRail();
  },1000);
  render();
}
function goHome(){ mode=null; domainSel=null; phase='landing'; clearInterval(timer); render(); }
function viewHistory(i){ historyViewId=i; phase='history'; render(); }
function setLang(x){ lang=x; render(); }

render();

function updateLangButtons(){
  const a=document.getElementById('btnAr'), f=document.getElementById('btnFr');
  if(a&&f){ a.className = lang==='ar'?'active':''; f.className = lang==='fr'?'active':''; }
}
const _origRender = render;
render = function(){
  _origRender();
  updateLangButtons();
  if(phase==='exam') renderRail();
};
updateLangButtons();
</script>
</body>
</html>
