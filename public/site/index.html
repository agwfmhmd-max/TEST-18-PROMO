    btn.classList.toggle("hidden", !pushSupported());
    btn.classList.toggle("on", notifState.on);
    btn.title = notifState.on ? t("notif_tooltip_on") : t("notif_tooltip");
    const dot = btn.querySelector(".nb-dot");
    if (notifState.on && !dot) {
      const d = document.createElement("span");
      d.className = "nb-dot";
      btn.appendChild(d);
    } else if (!notifState.on && dot) dot.remove();
  }
  const banner = $("#notifBanner");
  if (banner) {
    const denied = ("Notification" in window) && Notification.permission === "denied";
    const show = pushSupported() && !notifState.on && !notifBannerDismissed && !denied;
    banner.classList.toggle("hidden", !show);
    const ti = $("#nbTitle"), tx = $("#nbText"), be = $("#nbEnable"), bc = $("#nbClose");
    if (ti) ti.textContent = t("notif_banner_title");
    if (tx) tx.textContent = t("notif_banner_text");
    if (be) be.textContent = t("btn_notif_enable");
    if (bc) bc.textContent = t("btn_later");
  }
}

/** \u062a\u0641\u0639\u064a\u0644 \u0627\u0644\u062a\u0646\u0628\u064a\u0647\u0627\u062a \u0644\u0644\u0632\u0627\u0626\u0631 (\u0628\u062f\u0648\u0646 \u062a\u0633\u062c\u064a\u0644 \u062f\u062e\u0648\u0644) */
async function enablePush() {
  if (notifState.busy) return;
  if (!pushSupported()) {
    toast(isIOSDevice && !isStandaloneMode() ? t("err_notif_ios") : t("err_notif_unsupported"), "err");
    return;
  }
  notifState.busy = true;
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast(t("err_notif_denied"), "err"); return; }

    const reg = await swRegistration();
    if (!reg || !reg.pushManager) { toast(t("err_notif_unsupported"), "err"); return; }

    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(await loadVapidPublicKey())
      });
    }

    const { error } = await db.rpc("save_push_subscription", {
      p_endpoint: sub.endpoint,
      p_p256dh: subKey(sub, "p256dh"),
      p_auth: subKey(sub, "auth"),
      p_device_id: notifDeviceId(),
      p_user_agent: navigator.userAgent.slice(0, 300),
      p_lang: state.lang
    });
    if (error) throw error;

    notifState.on = true;
    notifBannerDismissed = true;
    try { sessionStorage.setItem("iscae-notif-dismissed", "1"); } catch (e) {}
    refreshNotifButton();
    toast(t("msg_notif_enabled"));
  } catch (err) {
    console.error("[Push] enable failed:", err);
    toast(err && err.message ? err.message : t("err_notif_generic"), "err");
  } finally {
    notifState.busy = false;
  }
}

/** \u0625\u0644\u063a\u0627\u0621 \u0627\u0644\u062a\u0646\u0628\u064a\u0647\u0627\u062a \u0644\u0647\u0630\u0627 \u0627\u0644\u062c\u0647\u0627\u0632 */
async function disablePush() {
  if (notifState.busy) return;
  notifState.busy = true;
  try {
    const sub = await currentPushSub();
    if (sub) {
      await db.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
      try { await sub.unsubscribe(); } catch (e) {}
    }
    notifState.on = false;
    refreshNotifButton();
    toast(t("msg_notif_disabled"));
  } catch (err) {
    console.error("[Push] disable failed:", err);
    toast(t("err_notif_generic"), "err");
  } finally {
    notifState.busy = false;
  }
}

function toggleNotifications() {
  return notifState.on ? disablePush() : enablePush();
}

/** \u0625\u0634\u0639\u0627\u0631 \u062f\u0627\u062e\u0644\u064a \u0641\u0648\u0631\u064a \u0639\u0646\u062f\u0645\u0627 \u064a\u0643\u0648\u0646 \u0627\u0644\u0645\u0648\u0642\u0639 \u0645\u0641\u062a\u0648\u062d\u0627\u064b */
function subscribeNotifRealtime() {
  try {
    db.channel("iscae-notifications-live")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications" }, (payload) => {
        const n = payload && payload.new;
        if (!n) return;
        toast((n.title || "") + (n.body ? " — " + n.body : ""));
        if (state.me && isSuper() && state.tab === "notifs") renderDash();
      })
      .subscribe();
  } catch (e) { console.warn("[Push] realtime unavailable", e); }
}

/** \u062a\u0647\u064a\u0626\u0629 \u062d\u0627\u0644\u0629 \u0627\u0644\u062a\u0646\u0628\u064a\u0647\u0627\u062a \u0639\u0646\u062f \u0627\u0644\u0625\u0642\u0644\u0627\u0639 */
async function initNotifications() {
  refreshNotifButton();
  if (!pushSupported()) return;
  await loadVapidPublicKey();
  try {
    const sub = await currentPushSub();
    notifState.on = !!sub && Notification.permission === "granted";
    if (notifState.on) {
      // \u062a\u062c\u062f\u064a\u062f \u0627\u0644\u0635\u0641 \u0641\u064a \u0642\u0627\u0639\u062f\u0629 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a (\u0625\u0646 \u062d\u064f\u062f\u0650\u0641 \u0623\u0648 \u062a\u063a\u064a\u0631 endpoint)
      const { error } = await db.rpc("save_push_subscription", {
        p_endpoint: sub.endpoint,
        p_p256dh: subKey(sub, "p256dh"),
        p_auth: subKey(sub, "auth"),
        p_device_id: notifDeviceId(),
        p_user_agent: navigator.userAgent.slice(0, 300),
        p_lang: state.lang
      });
      if (error) throw error;
    }
  } catch (e) { console.warn("[Push] init", e); }
  refreshNotifButton();
  subscribeNotifRealtime();
}

/* ---- \u0631\u0628\u0637 \u0627\u0644\u0623\u0632\u0631\u0627\u0631 ---- */
if ($("#btnNotif")) $("#btnNotif").onclick = toggleNotifications;
if ($("#nbEnable")) $("#nbEnable").onclick = enablePush;
if ($("#nbClose")) $("#nbClose").onclick = () => {
  notifBannerDismissed = true;
  try { sessionStorage.setItem("iscae-notif-dismissed", "1"); } catch (e) {}
  refreshNotifButton();
};

/* ---- \u0644\u0648\u062d\u0629 \u0627\u0644\u0645\u0634\u0631\u0641 \u0627\u0644\u0631\u0626\u064a\u0633\u064a: \u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u0625\u0634\u0639\u0627\u0631\u0627\u062a ---- */
async function loadNotifications() {
  const { data } = await db.from("notifications").select("*").order("created_at", { ascending: false }).limit(50);
  return data || [];
}
async function countActiveSubs() {
  const { data, error } = await db.rpc("count_active_push_subscriptions");
  if (error) {
    console.error("[Push] count devices failed:", error);
    return 0;
  }
  return Number(data || 0);
}

async function renderNotifsTab(panel) {
  if (!isSuper()) { panel.innerHTML = `<div class="empty">${t("err_forbidden_super")}</div>`; return; }
  panel.innerHTML = `<div class="panel-head"><h2>${t("notifs_title")}</h2></div>
    <p class="muted" style="font-size:13px">${t("notifs_note")}</p>`;
  const [rows, subs] = await Promise.all([loadNotifications(), countActiveSubs()]);

  panel.innerHTML = `
    <div class="panel-head">
      <h2>${t("notifs_title")}</h2>
      <span class="badge">${t("notifs_subs_count")}: ${subs}</span>
    </div>
    <form id="notifForm" class="stack" style="max-width:720px">
      <p class="muted" style="font-size:13px">${t("notifs_note")}</p>
      <div class="field"><label>${t("field_notif_title")}</label>
        <input id="notif-title" maxlength="120" required /></div>
      <div class="field"><label>${t("field_notif_body")}</label>
        <textarea id="notif-body" rows="3" maxlength="500" required></textarea></div>
      <div class="field"><label>${t("field_notif_url")}</label>
        <input id="notif-url" dir="ltr" placeholder="https://..." /></div>
      <button class="btn btn-primary" type="button" id="notif-send" style="align-self:flex-start">${t("btn_send_notif")}</button>
    </form>
    <h3 style="font-weight:900;margin-top:24px">${t("notifs_history")}</h3>
    <div class="notif-list">
      ${rows.length ? rows.map(n => `
        <div class="notif-item">
          <b>${esc(n.title)}</b>
          <p>${esc(n.body)}</p>
          <div class="nmeta">
            <span>${esc(String(n.created_at || "").replace("T", " ").slice(0, 16))}</span>
            <span>${t("notif_sent_stat", { ok: n.success_count ?? 0, fail: n.failure_count ?? 0 })}</span>
            ${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)}</a>` : ""}
          </div>
        </div>`).join("") : `<div class="empty">${t("no_notifs")}</div>`}
    </div>`;

  const btn = panel.querySelector("#notif-send");
  btn.onclick = async () => {
    const title = panel.querySelector("#notif-title").value.trim();
    const body  = panel.querySelector("#notif-body").value.trim();
    const url   = panel.querySelector("#notif-url").value.trim();
    if (!title || !body) { toast(t("err_notif_missing_fields"), "err"); return; }
    btn.disabled = true;
    try {
      /* الإرسال عبر خادم الموقع نفسه (TanStack server route) — بدون Edge Functions */
      const { data: { session } } = await db.auth.getSession();
      if (!session) throw new Error(t("err_notif_send"));
      const res = await fetch("/api/public/push/send", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "authorization": "Bearer " + session.access_token
        },
        body: JSON.stringify({ title, body, url: url || null })
      });
      let data = null;
      try { data = await res.json(); } catch (_) { data = null; }
      if (!res.ok || !data || data.error) {
        throw new Error((data && data.error) || t("err_notif_send"));
      }
      toast(t("notif_sent_ok", { n: (data && data.sent) ?? 0 }));
      renderDash();
    } catch (err) {
      console.error("[Push] send failed:", err);
      toast(err.message || t("err_notif_send"), "err");
    } finally {
      btn.disabled = false;
    }
  };
}

/* ------------------------- 19. BOOTSTRAP ------------------------- */
async function init() {
  initTheme();
  applyLangAttrs();
  applyStaticI18n();
  refreshInstallButton();
  const { data: { session } } = await db.auth.getSession();
  state.session = session || null;
  await loadPublicData();
  applyBranding();
  renderStats();
  renderEvents();
  runSearch();
  routeFromHash();
  if (state.session) { await loadMe(); if (isSuper()) await loadAdmins(); }
  syncHeader();
  initNotifications();
}
init().catch(err => { console.error(err); toast(t("toast_db_error"), "err"); });

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") { state.session = null; state.me = null; syncHeader(); }
});
</script>
